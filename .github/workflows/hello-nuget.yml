
name: Hello NuGet

on:
  workflow_dispatch:

jobs:
  hello-nuget:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      
      - name: Build
        run: dotnet build --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./packages

      - name: Authenticate with NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Publish
        run: |
          dotnet nuget push "./packages/*.nupkg" \
          --source "https://api.nuget.org/v3/index.json" \
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"

